<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>

<body>
    <!--Cree un Formulario con los campos que se proponen a continuacion-->
    <!--Agregue el atributo legend-->

    <!--Si tienes dudas de como hacer un formulario, puedes consultar:
    https://www.w3schools.com/html/tryit.asp?filename=tryhtml_elem_output-->

    <h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>
    <form name="form-suscripcion">
        <p>
            Nombre:<input type="text" name="Nombre" placeholder="Ingrese el nombre"></intput>
        </p>
        <p>
            Apellido:<input type="text" name="Apellido" placeholder="Ingrese el apellido"></intput>
        </p>
        <p>
            Sexo:
            Masculino: <input type="radio" name="Sex" value="masculino">
            Femenino: <input type="radio" name="Sex" value="femenino">
        <p>
            Edad: <input type="number" name="Edad" placeholder="edad" maxlength="3">
        </p>
        <p>
            Email: <input type="text" name="email" placeholder="usuario@dominio">
        </p>
        <p>
            Usuario: <input type="text" name="usuario" placeholder="Nombre de usuario" </p>
        <p>
            Password:
            <input type="password" name="password" placeholder="contrasena">
        </p>
        <p>
            Confirmar Password:
            <input type="password" name="segunda-password" placeholder="contrasena">
        </p>
        <p>
            Tipo de servicio:
            <select name="tipo-servicio">
                <option value="Free">Free</option>
                <option value="Standard"> Standard </option>
                <option value="Premium">Premium </option>
            </select>
        </p>
        <p>
            Tema:
            Política <input type="checkbox" value="politica">
            Negocios <input type="checkbox" value="negocios">
            Tecnología <input type="checkbox" value="tecnologia">
            Salud <input type="checkbox" value="salud">
        </p>
        <p>
            Agregue un comentario:
            <textarea>
                Deje su comentario...
            </textarea>
        </p>
        <p>
            <button type="button">
                Enviar
            </button>
        </p>
    </form>
</body>

</html>
