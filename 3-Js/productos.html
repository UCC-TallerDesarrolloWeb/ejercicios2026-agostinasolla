<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Catalogo de productos</title>
    <link href="catalogo.css" type="text/css" rel="stylesheet">
    <script type="text/javascript" src="tienda.js"></script>
</head>

<body class="grid-container" onload="mostrarCatalogo()">
    <header class="item1">
        Catalogo de productos
        <nav class="item2">
            <a href="productos.html">Catalogo de productos</a>
            <a href="">Carrito de compras</a>
        </nav>
        <aside class="item3">
            <form>
                <fieldset>
                    <legend>Buscador</legend>
                    <label for="search">Buscar</label>
                    <input type="text" name="search" id="search" placeholder="Buscar...">
                </fieldset>
                <fieldset>
                    <legend>Precios</legend>
                    <p>
                        <label for="price-min">Minimo</label>
                        <input type="number" name="price-min" id="price-min" min="0">
                    </p>
                </fieldset>
                <fieldset>
                    <legend>Precios</legend>
                    <p>
                        <label for="price-max">Minimo</label>
                        <input type="number" name="price-max" id="price-max" min="0">
                    </p>
                </fieldset>
                <fieldset>
                    <legend>Tipo de producto</legend>
                    <p>
                        <input type="checkbox" name="tipo" id="protectores" value="productos">
                        <label for="protectores">Protectores</label>
                    </p>
                    <p>
                        <input type="checkbox" name="tipo" id="entrenamiento" value="productos">
                        <label for="entrenamiento">Entrenamiento</label>
                    </p>
                    <p>
                        <input type="checkbox" name="tipo" id="dobok" value="productos">
                        <label for="dobok">Dobok</label>
                    </p>
                </fieldset>
            </form>
        </aside>
    </header>
    <dialog id="modal">
        <h2 id="nombre-producto">Cabezal Cerrado</h2>
        <p id="descripcion-producto">Cabezal de sparing disponible en color azul o rojo</p>
        <button type="button" onclick="cerrarModal()">Cerrar</button>
    </dialog>
    <main class="item4">
        <div>
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/cabezal-cerrado.webp"
                <p>Cabezal cerrado</p>
            <button type="button" onclick="mostrarModal()">Ver detalle del producto</button>
        </div>
        <div>
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/dobok.webp" <p>Dobok</p>
        </div>
        <div>
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/escudo-potencia.webp"
                <h3>Escudo potencia</h3>
        </div>
        <div>
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/protectores-manos.webp"
                <h3>Protectores manos</h3>
        </div>
        <div>
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/foco-con-dedos.webp" <h3>Foco
            con dedos</h3>
        </div>
        <div>
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/protectores-pies.webp"
                <h3>Protectores pies</h3>
        </div>
    </main>
    <footer class="item5">
        Contacto
    </footer>
</body>

</html>
